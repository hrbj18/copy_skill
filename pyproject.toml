[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-content-intelligence"
version = "0.3.0"
description = "Normalize, rank, deduplicate, and export Douyin technology content intelligence."
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.2.0", "httpx>=0.28.1", "opencv-python>=5.0.0.93", "Pillow>=11.0.0", "rapidocr>=3.4.2", "tzdata>=2025.2"]

[project.scripts]
douyin-intelligence = "douyin_intelligence.cli:main"

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
